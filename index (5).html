<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelada de vôlei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#0E1B2E; --muted:#5C697D; --line:#DDE3EB;
  --a:#FFC531; --a-ink:#2A1C00; --a-soft:#FFF1C7;
  --b:#1F5FD6; --b-ink:#FFFFFF; --b-soft:#DCE7FB;
  --net:#0E1B2E; --danger:#C2361F; --ok:#15845A; --bronze:#C98A55;
  --shadow:0 1px 2px rgba(14,27,46,.05),0 10px 24px -14px rgba(14,27,46,.22);
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A111E; --surface:#131D30; --sunk:#0F1828; --ink:#EDF1F7; --muted:#95A3B8; --line:#24324B;
    --a:#FFC94A; --a-ink:#241800; --a-soft:#3A3012; --b:#3D7BEA; --b-ink:#FFFFFF; --b-soft:#17284A;
    --net:#EDF1F7; --danger:#F08068; --ok:#4FD19A; --bronze:#D29A6A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A111E; --surface:#131D30; --sunk:#0F1828; --ink:#EDF1F7; --muted:#95A3B8; --line:#24324B;
  --a:#FFC94A; --a-ink:#241800; --a-soft:#3A3012; --b:#3D7BEA; --b-ink:#FFFFFF; --b-soft:#17284A;
  --net:#EDF1F7; --danger:#F08068; --ok:#4FD19A; --bronze:#D29A6A; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 56px}

/* topo */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.cloud .dot,.sync.sheets .dot{background:var(--ok)}
.sync.sheets-error .dot,.sync.error .dot{background:var(--danger)}
.sync.syncing .dot,.sync.loading .dot,.sync.sheets-loading .dot{background:var(--a)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:0 -16px 20px;padding:0 8px}
.nav button{border:0;background:none;padding:12px 4px 13px;font-weight:600;color:var(--muted);position:relative;font-size:15px}
.nav button[aria-current="true"]{color:var(--ink)}
.nav button[aria-current="true"]::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:14px;margin:0 0 16px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,27,46,.12)}

h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 8px;line-height:1.05;letter-spacing:-.005em}
h3{font-family:var(--display);font-weight:700;font-size:20px;margin:28px 0 10px;line-height:1.1}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 10px}
.shead h3{margin:0}
.shead span{font-size:14px;color:var(--muted)}
p.hint{color:var(--muted);margin:4px 0 12px;font-size:15px}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;box-shadow:var(--shadow)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:18px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.icon{width:40px;min-height:40px;padding:0;box-shadow:none}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* listas */
.list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow,.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13.5px;color:var(--muted)}
.item.clickable{cursor:pointer}
.item.clickable:hover{background:var(--sunk)}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
.pos{font-family:var(--display);font-weight:700;font-size:20px;width:24px;text-align:center;color:var(--muted);flex:none}
.tag{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.a{background:var(--a);color:var(--a-ink)}
.tag.b{background:var(--b);color:var(--b-ink)}
.tag.res{background:var(--sunk);color:var(--ink)}
.tag.off{background:transparent;border:1px dashed var(--line)}
.tag.live{background:transparent;color:var(--ok);padding-left:0;display:inline-flex;align-items:center;gap:6px}
.tag.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none;letter-spacing:.02em}
.av.c0{background:#FFE7A3;color:#4A3500}.av.c1{background:#D6E4FF;color:#16336E}.av.c2{background:#D3F0E1;color:#0F5135}
.av.c3{background:#FAD9DD;color:#6E1E28}.av.c4{background:#E6DDFA;color:#3B2A73}.av.c5{background:#FFDFCB;color:#6A3110}
.elo{font-family:var(--display);font-weight:700;font-size:17px;padding:4px 10px;min-width:58px;text-align:center;border-radius:10px;background:var(--sunk);border:0;min-height:36px}

/* início */
.livecard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;overflow:hidden;padding:0;box-shadow:var(--shadow);margin-bottom:10px}
.lc-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lc-head b{display:block;font-size:17px}
.lc-go{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.lc-score{display:grid;grid-template-columns:1fr 8px 1fr}
.lc-score div{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;padding:10px 16px 12px;font-variant-numeric:tabular-nums}
.lc-score .a{background:var(--a);color:var(--a-ink)}
.lc-score .b{background:var(--b);color:var(--b-ink);text-align:right}
.lc-score .n{padding:0}
.daybox{width:48px;text-align:center;border-radius:12px;background:var(--sunk);padding:6px 0 5px;flex:none}
.daybox b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.daybox span{font-size:11.5px;color:var(--muted);font-weight:600}

/* formulário */
.field{margin:0 0 20px}
.field label.l,.lbl{display:block;font-weight:600;margin-bottom:8px}
.input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:48px}
.input:focus{border-color:var(--b);outline:none;box-shadow:0 0 0 3px var(--b-soft)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:48px;height:48px;font-size:22px;font-weight:600}
.stepper output{font-family:var(--display);font-weight:800;font-size:26px;min-width:64px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choice{display:grid;grid-template-columns:18px 1fr;column-gap:12px;row-gap:2px;align-items:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;margin-bottom:8px;text-align:left;width:100%}
.choice::before{grid-row:1 / span 2;content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice[aria-pressed="true"]::before{border:6px solid var(--ink)}
.choice b,.choice span{grid-column:2}
.choice b{display:block}
.item .btn.small{box-shadow:none}
.choice span{font-size:14px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--b)}
.range-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--b)}
.pick{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.pick:first-child{border-top:0}
.pick .order{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none}
.pick[aria-pressed="true"] .order{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picklist{max-height:380px;overflow:auto}
.start-cta{margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px 4px;box-shadow:var(--shadow)}

/* placar */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.hot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{display:grid;grid-template-columns:1fr 10px 1fr;border-radius:26px;overflow:hidden;min-height:370px;box-shadow:var(--shadow)}
.team{padding:16px 16px 14px;display:flex;flex-direction:column;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;position:relative;border:0;text-align:left;min-width:0}
.team.a{background:var(--a);color:var(--a-ink)}
.team.b{background:var(--b);color:var(--b-ink)}
.team:active{filter:brightness(.96)}
.team .tname{font-family:var(--display);font-weight:700;font-size:18px;opacity:.8}
.team .score{font-family:var(--display);font-weight:800;font-size:clamp(110px,32vw,200px);line-height:.82;font-variant-numeric:tabular-nums;margin:12px 0 14px;letter-spacing:-.04em}
.team .score.bump{animation:bump .22s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.team .score.bump,.tag.live::before{animation:none}}
.team ul{list-style:none;margin:0;padding:0;font-weight:600;font-size:15.5px;line-height:1.55;flex:1}
.team ul li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .minus{align-self:flex-start;margin-top:12px;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 16px;font-weight:700;min-height:38px;opacity:.75}
.net{background-color:var(--surface);background-image:repeating-linear-gradient(0deg,var(--net) 0 1.5px,transparent 1.5px 7px),repeating-linear-gradient(90deg,var(--net) 0 1.5px,transparent 1.5px 7px);opacity:.85}
.serve{display:inline-block;align-self:flex-start;margin-top:8px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent);font-weight:700;font-size:13px;white-space:nowrap}
.stk{font-size:12px;font-weight:500;opacity:.75;white-space:nowrap}
.taphint{text-align:center;font-size:13.5px;color:var(--muted);margin:10px 0 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
.act{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:52px;font-weight:600;box-shadow:var(--shadow);padding:6px 10px}
.act:disabled{opacity:.4;cursor:not-allowed}

/* ranking */
.rk-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rk-row:first-child{border-top:0}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;background:var(--sunk);color:var(--muted);flex:none}
.medal.m1{background:var(--a);color:var(--a-ink)}.medal.m2{background:var(--b);color:var(--b-ink)}.medal.m3{background:var(--bronze);color:#fff}
.pct{font-family:var(--display);font-weight:800;font-size:26px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:5px;background:var(--sunk);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.dim .pct,.dim .name{color:var(--muted)}
.period{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px;box-shadow:var(--shadow);text-align:center}
.period b{display:block;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1}
.period .btn.icon{border:0;background:var(--sunk)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,11,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:22px;padding:22px 20px;width:100%;max-width:520px;max-height:88vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet h2{margin-bottom:6px}
.win-banner{border-radius:16px;padding:18px;margin:-4px 0 14px;font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05}
.win-banner.a{background:var(--a);color:var(--a-ink)}
.win-banner.b{background:var(--b);color:var(--b-ink)}
.win-banner small{display:block;font-family:var(--body);font-weight:600;font-size:15px;opacity:.85;margin-top:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.notice{background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);margin:10px 0}
.deuce{color:inherit}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px;margin:6px 0 12px}
.step{text-align:center;min-width:0}
.step .who{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;overflow-wrap:anywhere;margin-bottom:2px}
.step .rec{font-size:12px;color:var(--muted);margin-bottom:6px}
.step .block{border-radius:12px 12px 0 0;font-family:var(--display);font-weight:800;font-size:40px;display:grid;place-items:center}
.p1 .block{height:132px;background:var(--a);color:var(--a-ink)}
.p2 .block{height:96px;background:var(--b);color:var(--b-ink)}
.p3 .block{height:70px;background:var(--bronze);color:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>

<script>
/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const fmtDate = t => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
const TEAM = { A: 'Time amarelo', B: 'Time azul' };

/* ---------- armazenamento ---------- */
const LS = 'pelada_volei_v1:';
function lsGet(k) { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
const store = { db: null, uid: null, status: 'local', sheets: null, sheetsReady: false };
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');

/* ---------- Google Planilhas (só no site publicado fora do Claude) ---------- */
const shPending = {}, shDeletes = new Set();
let shTimer = null, shBusy = false, shRetry = null;
function sheetsCfg() { try { return JSON.parse(localStorage.getItem(LS + 'sheets') || 'null'); } catch (e) { return null; } }
function setStatus(s) { store.status = s; renderSync(); }
function sheetsSchedule(delay = 2500) { clearTimeout(shTimer); shTimer = setTimeout(sheetsFlush, delay); }
async function sheetsFlush() {
  if (!store.sheets || !store.sheetsReady) return;
  if (shBusy) { sheetsSchedule(1000); return; }
  const keys = Object.keys(shPending), dels = [...shDeletes];
  if (!keys.length && !dels.length) return;
  const docs = {};
  keys.forEach(k => { docs[k] = shPending[k]; delete shPending[k]; });
  shDeletes.clear();
  shBusy = true; setStatus('syncing');
  try {
    const r = await fetch(store.sheets.url, { method: 'POST', body: JSON.stringify({ key: store.sheets.key, docs, deletes: dels }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error === 'senha' ? 'senha errada' : (j.error || 'erro'));
    setStatus(Object.keys(shPending).length ? 'syncing' : 'sheets');
  } catch (e) {
    Object.keys(docs).forEach(k => { if (!shPending[k]) shPending[k] = docs[k]; });
    dels.forEach(d => shDeletes.add(d));
    setStatus('sheets-error'); sheetsSchedule(15000);
  }
  shBusy = false;
}
async function sheetsLoad(cfg) {
  const u = cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key);
  const r = await fetch(u);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === 'senha' ? 'senha errada' : 'resposta inválida');
  return j;
}
async function syncFromSheet(showToast) {
  clearTimeout(shRetry);
  setStatus('sheets-loading');
  try {
    const j = await sheetsLoad(store.sheets);
    if (j.main) {
      // a planilha manda: substitui o que está neste aparelho
      S = normalizeMain(j.main); lsSet('main', S);
      Object.entries(j.games || {}).forEach(([id, g]) => lsSet('g_' + id, g));
      if (view === 'game' && G) { if (j.games && j.games[G.id]) G = j.games[G.id]; else { G = null; view = 'home'; } }
    } else {
      // planilha vazia: envia o que existe aqui
      shPending.main = clone(S);
      S.games.forEach(g => { const gd = lsGet('g_' + g.id); if (gd) shPending['g_' + g.id] = gd; });

/* ---------- sorteio equilibrado ---------- */
// Pares que jogaram juntos nas últimas 2 partidas pesam no sorteio (mais recente pesa mais)
const pk = (a, b) => a < b ? a + '|' + b : b + '|' + a;
function recentPairs() {
  const r = {};
  if (!G || G.cfg.vary === false) return r;
  const last = G.matches.slice(-2).reverse();
  last.forEach((m, idx) => {
    const w = [30, 15][idx];
    [m.A, m.B].forEach(team => { for (let x = 0; x < team.length; x++) for (let y = x + 1; y < team.length; y++) { const k = pk(team[x], team[y]); r[k] = (r[k] || 0) + w; } });
  });

}
// Gera muitas divisões aleatórias, ordena pela diferença de elo e escolhe ao acaso
// entre as melhores. Quanto maior o equilíbrio, menor o grupo de onde sai o sorteio,
// mas ele nunca fica restrito a uma única combinação.
function drawTeams(ids, balance) {
  if (ids.length < 2) return { A: ids.slice(), B: [] };
  const elo = id => P(id).elo;
  const sum = a => a.reduce((s, i) => s + elo(i), 0);
  const half = Math.ceil(ids.length / 2);
  const recent = recentPairs();
  const pen = team => { let p = 0; for (let x = 0; x < team.length; x++) for (let y = x + 1; y < team.length; y++) p += recent[pk(team[x], team[y])] || 0; return p; };
  const tries = [];
  for (let t = 0; t < 400; t++) {
    const sh = shuffle(ids);
    const A = sh.slice(0, half), B = sh.slice(half);
    tries.push({ A, B, diff: Math.abs(sum(A) / A.length - sum(B) / Math.max(B.length, 1)) + pen(A) + pen(B) });
  }
  tries.sort((x, y) => x.diff - y.diff);
  const b = Math.min(100, Math.max(0, balance)) / 100;
  const k = Math.max(4, Math.round(tries.length * Math.pow(1 - b, 2)));
  const pick = tries[Math.floor(Math.random() * Math.min(k, tries.length))];
  return { A: pick.A, B: pick.B };
}
const avgElo = ids => ids.length ? ids.reduce((s, i) => s + P(i).elo, 0) / ids.length : 0;

/* ---------- regras da pelada ---------- */
function statusOf(id) {

  if (G.inactive.includes(id)) return { k: 'off', t: 'Inativo' };

}
// Sempre com 2 de vantagem: perto do fim o alvo sobe (em partida de 11, 10x10 vai a 12 e 11x11 vai a 13)
const target = () => Math.max(G.cfg.maxPoints, Math.min(G.score.A, G.score.B) + 2);

  const queue = order.filter(i => !onCourt.includes(i));
  G = null;
  const t = drawTeams(onCourt, d.balance);
  G = {
    id: 'g' + uid(), name: d.name.trim() || 'Pelada de ' + fmtDate(Date.now()), createdAt: Date.now(), status: 'live',
    cfg: { teamSize: n, maxPoints: d.maxPoints, winMode: d.winMode, balance: d.balance, streakLimit: d.streakLimit, vary: d.vary },
    roster: order, inactive: [], court: { A: t.A, B: t.B }, queue, score: { A: 0, B: 0 }, matches: [], lastUndo: null, streak: {}, firstServe: Math.random() < 0.5 ? 'A' : 'B'

function finishMatch(winner, mode) {
  const n = G.cfg.teamSize, loser = winner === 'A' ? 'B' : 'A';
  const W = G.court[winner].slice(), L = G.court[loser].slice();
  const undo = { court: clone(G.court), queue: G.queue.slice(), score: { ...G.score }, winner, W, L, elo: {}, streak: clone(G.streak || {}) };
  // elo por média dos times
  const exp = 1 / (1 + Math.pow(10, (avgElo(L) - avgElo(W)) / 400));
  const delta = 24 * (1 - exp);
  W.forEach(i => { if (S.players[i]) { const p = S.players[i]; p.elo += delta; p.j++; p.v++; undo.elo[i] = delta; } });
  L.forEach(i => { if (S.players[i]) { const p = S.players[i]; p.elo -= delta; p.j++; p.d++; undo.elo[i] = -delta; } });
  G.matches.push({ A: G.court.A.slice(), B: G.court.B.slice(), sa: G.score.A, sb: G.score.B, w: winner, mode, t: Date.now() });

  const st = G.streak || (G.streak = {});
  W.forEach(i => { st[i] = (st[i] || 0) + 1; });

    pool = stay.concat(q.splice(0, Math.min(2 * n - stay.length, q.length)));
    const back = L.concat(capped);

  closeModal(); render();
  toast(`${TEAM[winner]} venceu. ${left.length ? left.map(i => P(i).name).join(', ') + (left.length > 1 ? ' saíram' : ' saiu') + ' pelo limite de vitórias. ' : ''}Novos times sorteados. ${TEAM[serveSide()]} começa com a bola.`);

/* ranking mensal, anual e geral */
const MIN_RANK = 5;
let rankPeriod = 'mes';
let rankCursor = { y: new Date().getFullYear(), m: new Date().getMonth() };
let allGames = null, allGamesLoading = false;
async function loadAllGames() {
  if (allGamesLoading) return;
  allGamesLoading = true;
  const out = {};
  await Promise.all(S.games.map(async g => { const d = await loadDoc('g_' + g.id); if (d) out[g.id] = d; }));
  if (G) out[G.id] = G;
  allGames = out; allGamesLoading = false;
  if (view === 'ranking') render();
}
function periodStats(from, to) {
  const st = {}, games = new Set();
  let count = 0;
  const touch = i => st[i] || (st[i] = { id: i, j: 0, v: 0, d: 0 });
  Object.values(allGames || {}).forEach(g => (g.matches || []).forEach(m => {
    if (m.t < from || m.t >= to) return;
    count++; games.add(g.id);
    const W = m.w === 'A' ? m.A : m.B, L = m.w === 'A' ? m.B : m.A;
    W.forEach(i => { const s = touch(i); s.j++; s.v++; });
    L.forEach(i => { const s = touch(i); s.j++; s.d++; });
  }));
  return { rows: Object.values(st).filter(r => S.players[r.id]), count, games: games.size };
}
function viewRanking() {
  const tabs = `<div class="tabs" role="tablist">${[['mes', 'Mensal'], ['ano', 'Anual'], ['geral', 'Geral']].map(([k, l]) => `<button data-act="rperiod" data-v="${k}" aria-current="${rankPeriod === k}">${l}</button>`).join('')}</div>`;
  const rule = `Ordenado por taxa de vitória. Entra na classificação quem tem pelo menos ${MIN_RANK} partidas.`;
  if (rankPeriod === 'geral') {
    const rows = sortRank(Object.values(S.players).filter(p => p.j > 0).map(p => ({ id: p.id, j: p.j, v: p.v, d: p.d })));
    return `<h2>Ranking</h2>${tabs}<p class="hint">Soma de todas as peladas desde o começo. ${rule}</p>${rankTable(rows, true, MIN_RANK)}`;
  }
  if (!allGames) { loadAllGames(); return `<h2>Ranking</h2>${tabs}<div class="list"><div class="empty">Carregando as partidas…</div></div>`; }
  const { y, m } = rankCursor, mes = rankPeriod === 'mes';
  const from = (mes ? new Date(y, m, 1) : new Date(y, 0, 1)).getTime();
  const to = (mes ? new Date(y, m + 1, 1) : new Date(y + 1, 0, 1)).getTime();
  let label = mes ? new Date(y, m, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) : String(y);
  label = label.charAt(0).toUpperCase() + label.slice(1);
  const now = new Date();
  const isCurrent = mes ? (y === now.getFullYear() && m === now.getMonth()) : y === now.getFullYear();
  const ps = periodStats(from, to);
  return `<h2>Ranking</h2>${tabs}
  <div class="period"><button class="btn icon" data-act="rprev" aria-label="Período anterior">${ic('chevL')}</button>
    <div class="grow"><b>${esc(label)}</b><span class="meta">${ps.count} partida${ps.count === 1 ? '' : 's'} em ${ps.games} pelada${ps.games === 1 ? '' : 's'}</span></div>
    <button class="btn icon" data-act="rnext" ${isCurrent ? 'disabled' : ''} aria-label="Próximo período">${ic('chev')}</button></div>
  <p class="hint">Soma de todas as peladas ${mes ? 'do mês' : 'do ano'}. ${rule}</p>
  ${ps.rows.length ? rankTable(sortRank(ps.rows), false, MIN_RANK) : `<div class="list"><div class="empty">Nenhuma partida em ${esc(label.toLowerCase())}.</div></div>`}`;
}

    <p class="hint">Como seguir para a próxima partida?</p>
    <button class="choice" data-act="finish" data-w="${w}" data-mode="losers" aria-pressed="${m === 'losers'}"><b>Saem os perdedores e sorteia de novo</b><span>Vencedores ficam, reservas entram, quadra sorteada outra vez.${capTxt}</span></button>
    <button class="choice" data-act="finish" data-w="${w}" data-mode="all" aria-pressed="${m === 'all'}"><b>Saem todos, entram só reservas</b><span>Os ${G.court.A.length + G.court.B.length} da quadra vão para o fim da fila.</span></button>
    <button class="btn ghost wide" data-act="wincancel" data-w="${w}">Foi engano, tirar o último ponto</button>`);
}
function openEndMatchModal() {
  openModal(`<h2>Encerrar partida agora</h2><p class="hint">Escolha quem venceu. O placar atual fica registrado.</p>
    <div class="split"><button class="btn" style="background:var(--a);color:var(--a-ink);border-color:var(--a)" data-act="pickwin" data-w="A">Amarelo venceu</button>
    <button class="btn" style="background:var(--b);color:var(--b-ink);border-color:var(--b)" data-act="pickwin" data-w="B">Azul venceu</button></div>
    <button class="btn ghost wide" data-act="close" style="margin-top:8px">Cancelar</button>`);
}
let subOut = null;
function openSubModal() {
  const opt = (id, side) => `<button class="pick" data-act="subout" data-id="${id}" aria-pressed="${subOut === id}"><span class="order">${subOut === id ? '✓' : ''}</span><span class="grow"><span class="name" style="display:block">${esc(P(id).name)}</span><span class="meta">${side}</span></span></button>`;
  openModal(`<h2>Substituir</h2>
    <p class="hint">${subOut ? `Quem entra no lugar de ${esc(P(subOut).name)}? Quem sai vai para o fim da fila.` : 'Quem sai da quadra?'}</p>
    ${subOut
      ? `<div class="list">${G.queue.map((id, i) => `<button class="pick" data-act="subin" data-id="${id}"><span class="order">${i + 1}</span><span class="grow"><span class="name" style="display:block">${esc(P(id).name)}</span><span class="meta">Elo ${Math.round(P(id).elo)}</span></span></button>`).join('')}</div>
         <button class="btn ghost wide" data-act="subback" style="margin-top:8px">Voltar</button>`
      : `<div class="list">${G.court.A.map(i => opt(i, 'Amarelo')).join('')}${G.court.B.map(i => opt(i, 'Azul')).join('')}</div>
         <button class="btn ghost wide" data-act="close" style="margin-top:8px">Cancelar</button>`}`);
}
function openEloModal(id) {
  const p = S.players[id];
  openModal(`<h2>${esc(p.name)}</h2>
    <div class="field"><label class="l" for="ename">Nome</label><input class="input" id="ename" value="${esc(p.name)}"></div>
    <div class="field"><label class="l" for="eelo">Elo</label><input class="input" id="eelo" type="number" inputmode="numeric" step="10" value="${Math.round(p.elo)}">
    <p class="hint">Referência: 900 iniciante, 1000 médio, 1100 forte, 1200 muito forte.</p></div>
    <div class="split"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="psave" data-id="${id}">Salvar</button></div>
    <button class="btn ghost danger wide" data-act="pdel" data-id="${id}" style="margin-top:8px">Apagar jogador</button>`);
}
async function openBackup() {
  const games = {};
  for (const g of S.games) { const gd = await loadDoc('g_' + g.id); if (gd) { const { edit, ...doc } = gd; games[g.id] = doc; } }
  const txt = JSON.stringify({ app: 'pelada-volei', v: 1, main: S, games });
  openModal(`<h2>Exportar dados</h2><p class="hint">Copie este texto e cole em “Importar dados” na outra versão do app.</p>
    <textarea class="input" id="bk" rows="6" readonly style="font-size:12px">${esc(txt)}</textarea>
    <div class="split" style="margin-top:10px"><button class="btn" data-act="close">Fechar</button><button class="btn primary" data-act="bkcopy">Copiar</button></div>`);
}
function openImport() {
  openModal(`<h2>Importar dados</h2><p class="hint">Cole o texto exportado. Isso substitui os jogadores e as peladas deste app.</p>
    <textarea class="input" id="imp" rows="6" style="font-size:12px"></textarea>
    <div class="split" style="margin-top:10px"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="impdo">Importar</button></div>`);
}
function doImport() {
  let d;
  try { d = JSON.parse(document.getElementById('imp').value); } catch (e) { toast('Texto inválido. Copie o texto exportado inteiro.'); return; }
  if (!d || d.app !== 'pelada-volei' || !d.main) { toast('Esse texto não é um backup do app.'); return; }
  S = normalizeMain(clone(d.main));
  Object.values(d.games || {}).forEach(g => persist('g_' + g.id, g));
  saveMain(); G = null; closeModal(); view = 'players'; render();
  toast(`Importado: ${Object.keys(S.players).length} jogadores e ${S.games.length} peladas.`);
}
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = '', 2600); }

/* ---------- eventos ---------- */
function newDraft() {
  return { name: '', teamSize: 4, maxPoints: 15, winByTwo: false, winMode: 'losers', balance: 70, streakLimit: 3, vary: true, firstPick: 'order', selected: [], q: '' };
}
function clampFmt(o) { o.teamSize = Math.min(6, Math.max(2, o.teamSize)); o.maxPoints = Math.min(50, Math.max(3, o.maxPoints)); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'scrim') { if (e.target === el) closeModal(); return; }
  if (a !== 'point') e.stopPropagation();
  switch (a) {
    case 'go': view = el.dataset.v; if (view !== 'game') G && (G.edit = null); if (view === 'ranking') allGames = null; render(); break;
    case 'rperiod': rankPeriod = el.dataset.v; render(); break;
    case 'rprev': case 'rnext': {
      const d = a === 'rprev' ? -1 : 1;
      if (rankPeriod === 'mes') { const t = new Date(rankCursor.y, rankCursor.m + d, 1); rankCursor = { y: t.getFullYear(), m: t.getMonth() }; }
      else rankCursor = { ...rankCursor, y: rankCursor.y + d };
      render(); break;
    }
    case 'new': draft = newDraft(); view = 'new'; render(); break;
    case 'open': openGame(id); break;
    case 'tab': gameTab = el.dataset.v; G.edit = null; render(); break;
    case 'dset': draft[el.dataset.k] = el.dataset.val; render(); break;
    case 'draft-set': case 'edit-set': {
      const o = a === 'draft-set' ? draft : G.edit; const k = el.dataset.k;
      o[k] = (k === 'maxPoints' || k === 'streakLimit') ? +el.dataset.val : el.dataset.val; render(); break;
    }
    case 'draft-step': case 'edit-step': {
      const o = a === 'draft-step' ? draft : G.edit; o[el.dataset.k] += +el.dataset.d; clampFmt(o); render(); break;
    }
    case 'dpick': {
      const i = draft.selected.indexOf(id);
      if (i >= 0) draft.selected.splice(i, 1); else draft.selected.push(id);
      draft.q = ''; render(); const inp = document.getElementById('dq'); inp && inp.focus(); break;
    }
    case 'dnew': {
      const name = draft.q.trim(); if (!name) break;
      const pid = newPlayer(name); saveMain(); draft.selected.push(pid); draft.q = ''; render();
      const inp = document.getElementById('dq'); inp && inp.focus(); break;
    }
    case 'start':
      try { startGame(); }
      catch (err) { console.error(err); toast('Não foi possível iniciar: ' + (err && err.message ? err.message : err)); }
      break;
    case 'point': if (e.target.closest('.minus')) break; addPoint(el.dataset.t); break;
    case 'minus': removePoint(el.dataset.t); break;
    case 'redraw': redrawCourt(); break;
    case 'undo': confirmBox('Desfazer a última partida', 'O resultado sai do ranking, o elo volta ao que era e a quadra volta como estava antes.', 'Desfazer', undoLastMatch); break;
    case 'endmatch': openEndMatchModal(); break;
    case 'pickwin': openWinModal(el.dataset.w); break;
    case 'finish': finishMatch(el.dataset.w, el.dataset.mode); break;
    case 'wincancel': { const w = el.dataset.w; if (isWin() === w) removePoint(w); closeModal(); break; }
    case 'sub': subOut = null; openSubModal(); break;
    case 'subout': subOut = id; openSubModal(); break;
    case 'subback': subOut = null; openSubModal(); break;
    case 'subin': substitute(subOut, id); subOut = null; break;
    case 'up': moveUp(id); break;
    case 'deactivate': setInactive(id); toast(`${P(id).name} saiu do jogo.`); break;
    case 'activate': setActive(id); toast(`${P(id).name} voltou para a fila.`); break;
    case 'madd': addToGame(id); mgmtQuery = ''; render(); break;
    case 'mnew': { const name = mgmtQuery.trim(); if (!name) break; const pid = newPlayer(name); saveMain(); mgmtQuery = ''; addToGame(pid); break; }
    case 'applyfmt': { const f = { ...G.edit }; G.edit = null; applyFormat(f); break; }
    case 'closegame': confirmBox('Encerrar pelada', 'A pelada sai da lista ao vivo. O ranking fica guardado e você pode reabrir depois.', 'Encerrar', () => { G.status = 'done'; saveGame(); closeModal(); gameTab = 'ranking'; render(); openPodiumModal(); }); break;
    case 'reopen': G.status = 'live'; saveGame(); gameTab = 'quadra'; render(); break;
    case 'delgame': confirmBox('Apagar pelada', 'As partidas desta pelada somem do histórico. O ranking geral e o elo dos jogadores continuam como estão.', 'Apagar', async () => {
      S.games = S.games.filter(g => g.id !== G.id); saveMain();
      try { localStorage.removeItem(LS + 'g_' + G.id); } catch (e) {}
      if (store.db) { try { await store.db.doc(docPath('g_' + G.id)).delete(); } catch (e) {} }
      if (store.sheets) { delete shPending['g_' + G.id]; shDeletes.add('g_' + G.id); sheetsSchedule(); }
      G = null; closeModal(); view = 'home'; render();
    }, true); break;
    case 'pnew': {
      const name = playersQuery.trim(); if (!name) { toast('Digite um nome para cadastrar.'); break; }
      if (findByName(name)) { toast('Já existe um jogador com esse nome.'); break; }
      newPlayer(name); saveMain(); playersQuery = ''; render(); toast(`${name} cadastrado.`); break;
    }
    case 'pedit': openEloModal(id); break;
    case 'psave': {
      const p = S.players[id]; const name = document.getElementById('ename').value.trim(); const elo = +document.getElementById('eelo').value;
      if (name) p.name = name; if (Number.isFinite(elo) && elo > 0) p.elo = elo;
      saveMain(); closeModal(); render(); break;
    }
    case 'pdel': confirmBox('Apagar jogador', `${esc(S.players[id].name)} some da lista e do ranking geral. Nas peladas antigas aparece como “Jogador removido”.`, 'Apagar', () => { delete S.players[id]; saveMain(); closeModal(); render(); }, true); break;
    case 'backup': openBackup(); break;
    case 'import': openImport(); break;
    case 'impdo': doImport(); break;
    case 'bkcopy': {
      const t = document.getElementById('bk'); t.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      if (ok) toast('Copiado.');
      else if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast('Copiado.'), () => toast('Selecione o texto e copie manualmente.'));
      else toast('Selecione o texto e copie manualmente.');
      break;
    }
    case 'shconnect': {
      const url = document.getElementById('shurl').value.trim(), key = document.getElementById('shkey').value;
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { toast('Use o endereço que termina em /exec, gerado em Implantar.'); break; }
      if (!key) { toast('Digite a senha definida no script.'); break; }
      store.sheets = { url, key };
      try { localStorage.setItem(LS + 'sheets', JSON.stringify(store.sheets)); } catch (err) {}
      syncFromSheet(true); break;
    }
    case 'shreload':
      if (Object.keys(shPending).length || shBusy) { toast('Ainda salvando. Tente de novo em alguns segundos.'); break; }
      syncFromSheet(true); break;
    case 'shoff':
      confirmBox('Desconectar planilha', 'Os dados continuam na planilha e neste aparelho. Daqui em diante, este aparelho salva só aqui.', 'Desconectar', () => {
        try { localStorage.removeItem(LS + 'sheets'); } catch (err) {}
        store.sheets = null; store.sheetsReady = false; clearTimeout(shTimer); clearTimeout(shRetry);
        setStatus('local'); closeModal(); render();
      }); break;
    case 'close': closeModal(); break;
    case 'confirm-ok': modal._ok && modal._ok(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.innerHTML) { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'dq' && draft && draft.q.trim()) {
    const ex = findByName(draft.q);
    if (ex) { if (!draft.selected.includes(ex.id)) draft.selected.push(ex.id); draft.q = ''; render(); document.getElementById('dq').focus(); }
    else document.querySelector('[data-act="dnew"]')?.click();
  }
  if (e.key === 'Enter' && e.target.id === 'pq') document.querySelector('[data-act="pnew"]')?.click();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in === 'name') draft.name = t.value;
  else if (t.dataset.in === 'dq') { draft.q = t.value; document.getElementById('picklist').innerHTML = pickList(); }
  else if (t.dataset.in === 'mq') {
    mgmtQuery = t.value; const q = norm(mgmtQuery);
    const found = q ? Object.values(S.players).filter(p => norm(p.name).includes(q)).sort((a, b) => norm(a.name).localeCompare(norm(b.name))) : [];
    document.getElementById('mresults').innerHTML = mgmtResults(found, q);
  }
  else if (t.dataset.in === 'pq') {
    playersQuery = t.value; const pos = t.selectionStart; render();
    const inp = document.getElementById('pq'); inp.focus(); inp.setSelectionRange(pos, pos);
  }
  else if (t.dataset.range) {
    const o = t.dataset.range === 'draft' ? draft : G.edit; o.balance = +t.value;
    const lbl = document.querySelector(`label[for="${t.id}"]`); if (lbl) lbl.textContent = `Equilíbrio pelo elo: ${o.balance}%`;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chk) { const o = t.dataset.chk === 'draft' ? draft : G.edit; o[t.dataset.k] = t.checked; }
});

/* ---------- início ---------- */
async function boot() {
  S = normalizeMain(lsGet('main'));
  render();
  if (!IN_CLAUDE) {
    const cfg = sheetsCfg();
    if (cfg) { store.sheets = cfg; syncFromSheet(false); } else { store.status = 'local'; renderSync(); }
    return;
  }
  store.status = 'loading'; renderSync();
  const timer = setTimeout(() => { if (store.status === 'loading') { store.status = 'local'; renderSync(); } }, 10000);
  try {
    const db = await window.claude.use('db');
    const user = db ? await window.claude.use('user') : null;
    const id = user ? await user.id() : null;
    if (!db || !id) { clearTimeout(timer); store.status = 'local'; renderSync(); return; }
    store.db = db; store.uid = id;
    const snap = await db.doc(docPath('main')).get();
    clearTimeout(timer);
    if (snap.exists) {
      // junta o que foi criado neste aparelho enquanto a conta carregava
      const local = S; let merged = false;
      S = normalizeMain(clone(snap.data()));
      Object.values(local.players).forEach(p => { if (!S.players[p.id]) { S.players[p.id] = p; merged = true; } });
      local.games.forEach(g => { if (!S.games.find(x => x.id === g.id)) { S.games.push(g); merged = true; const gd = lsGet('g_' + g.id); if (gd) persist('g_' + g.id, gd); } });
      if (merged) persist('main', S); else lsSet('main', S);
    } else if (S.games.length || Object.keys(S.players).length) {
      persist('main', S);
      S.games.forEach(g => { const gd = lsGet('g_' + g.id); if (gd) persist('g_' + g.id, gd); });
    }
    store.status = 'cloud';
    if (view === 'game' && G) { const fresh = await loadDoc('g_' + G.id); if (fresh) G = fresh; }
    render();
  } catch (e) { clearTimeout(timer); store.status = 'local'; renderSync(); }
}
boot();
</script>
</body>
